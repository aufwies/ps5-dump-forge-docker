name: build

# 双平台 (Forgejo Actions + GitHub Actions), .github/workflows 两边识别
# 环境自描述 (借鉴 jellyfin-cix): 全部可变项由各平台仓库 variables 注入, 配了就用:
#   USE_MIRROR        true=Dockerfile 国内镜像源人格 (npm= npmmirror/crates=rsproxy/apt=南大/rustup=华为云)
#   HTTPS_PROXY       github 访问代理 (内网 runner 用); 未配=直连
#   REGISTRY_IMAGE    推送目标全名; 未配 → ghcr.io/<owner>/ps5-dump-forge 兜底
#   BASE_MIRROR_PREFIX 基座镜像前缀; 未配 → docker.io/library/
#   REGISTRY_USER     内网 registry 用户名; 未配 → rgan
# 软互斥约定 (非强制): 内网 = 全配 (mirror=true+proxy+内网registry); GitHub = 全不配
# 触发: 每日检查上游 quer3q/ps5-dump-forge main; dispatch 可强制

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build.yml', 'Dockerfile', 'docker-compose.yaml']
  schedule:
    - cron: "30 21 * * *"   # 每天 05:30 CST
  workflow_dispatch:
    inputs:
      force:
        description: "忽略上游 sha 检查, 强制构建 (true/false)"
        required: false
        default: "false"

env:
  USE_MIRROR: ${{ vars.USE_MIRROR }}
  HTTPS_PROXY: ${{ vars.HTTPS_PROXY }}
  REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}
  BASE_MIRROR_PREFIX: ${{ vars.BASE_MIRROR_PREFIX }}
  REGISTRY_USER: ${{ vars.REGISTRY_USER }}

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
      sha: ${{ steps.cmp.outputs.sha }}
    steps:
      - name: clone
        env:
          TOK: ${{ secrets.REGISTRY_PASSWORD }}
          SU: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          echo "SU=[$SU] REPO=[$REPO] mirror=[$USE_MIRROR] proxy=[${HTTPS_PROXY:+set}]"
          if [ -n "$TOK" ]; then
            git clone -q -c http.proxy= "https://oauth2:${TOK}@${SU#https://}/${REPO}.git" ws
          else
            git clone -q -c http.proxy= "${SU}/${REPO}.git" ws
          fi
          echo CLONE_OK
      - name: compare upstream sha
        id: cmp
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          # api.github.com 通道; 代理由顶层 HTTPS_PROXY env 决定 (配了就走)
          SHA=""
          for i in 1 2 3; do
            SHA=$(curl -s --max-time 30 "https://api.github.com/repos/quer3q/ps5-dump-forge/commits/main" | grep -m1 '"sha"' | cut -d'"' -f4 || true)
            [ -n "$SHA" ] && break
            echo "sha fetch try$i failed"; sleep 5
          done
          if [ -z "$SHA" ]; then
            echo "::notice:: api.github unreachable — skip this round (no build)"
            echo "changed=false" >> $GITHUB_OUTPUT; echo "sha=" >> $GITHUB_OUTPUT
            exit 0
          fi
          OLD=$(cat ws/.upstream-sha 2>/dev/null || echo none)
          echo "upstream: $SHA (last built: $OLD, force: $FORCE)"
          if [ "$SHA" = "$OLD" ] && [ "$FORCE" != "true" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
          echo "sha=$SHA" >> $GITHUB_OUTPUT

  build:
    needs: check-upstream
    if: needs.check-upstream.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: clone
        env:
          TOK: ${{ secrets.REGISTRY_PASSWORD }}
          SU: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$TOK" ]; then
            git clone -q -c http.proxy= "https://oauth2:${TOK}@${SU#https://}/${REPO}.git" ws
          else
            git clone -q -c http.proxy= "${SU}/${REPO}.git" ws
          fi
      - name: resolve vars
        id: vars
        run: |
          ARCH=$(uname -m); [ "$ARCH" = "aarch64" ] && TAG=arm64 || TAG=x86
          M="${USE_MIRROR:-false}"; [ "$M" = "true" ] && M=on || M=off
          if [ -n "$REGISTRY_IMAGE" ]; then IMG="$REGISTRY_IMAGE"; else IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ps5-dump-forge"; fi
          BP="${BASE_MIRROR_PREFIX:-docker.io/library/}"
          echo "img=$IMG" >> $GITHUB_OUTPUT; echo "tag=$TAG" >> $GITHUB_OUTPUT; echo "mirror=$M" >> $GITHUB_OUTPUT; echo "bp=$BP" >> $GITHUB_OUTPUT
          echo "image: $IMG:$TAG (mirror=$M, base=$BP)"
      - name: fetch upstream source
        run: |
          mkdir -p ws/src
          curl -sfL --max-time 300 "https://api.github.com/repos/quer3q/ps5-dump-forge/tarball/${{ needs.check-upstream.outputs.sha }}" -o up.tgz
          tar xzf up.tgz -C ws/src --strip-components=1
          rm up.tgz && ls ws/src | head -5
      - name: docker build (native + cross)
        run: |
          cd ws
          # 本机原生 + 交叉另一架构 (--target 剪枝, 每次恰好两轮编译)
          ARCH=$(uname -m); [ "$ARCH" = "aarch64" ] && { NATIVE=arm64; CROSS=x86; } || { NATIVE=x86; CROSS=arm64; }
          echo "native=$NATIVE cross=$CROSS (mirror=${{ steps.vars.outputs.mirror }})"
          docker build --build-arg MIRROR=${{ steps.vars.outputs.mirror }} --build-arg BASE_PREFIX=${{ steps.vars.outputs.bp }} --target rt-native \
            -t ${{ steps.vars.outputs.img }}:$NATIVE -t ${{ steps.vars.outputs.img }}:latest-$NATIVE .
          docker build --build-arg MIRROR=${{ steps.vars.outputs.mirror }} --build-arg BASE_PREFIX=${{ steps.vars.outputs.bp }} --target rt-$CROSS \
            -t ${{ steps.vars.outputs.img }}:$CROSS -t ${{ steps.vars.outputs.img }}:latest-$CROSS .
          echo "NATIVE=$NATIVE" >> $GITHUB_ENV; echo "CROSS=$CROSS" >> $GITHUB_ENV
      - name: smoke test (WebUI embedded, native arch only)
        run: |
          # host 网络: smoke 容器直接监听 dind 的 8095 (job 容器经默认网关可达, 零端口映射零跨网问题)
          CID=$(docker run -d --network host ${{ steps.vars.outputs.img }}:$NATIVE --root /tmp)
          GW=$(ip route | awk '/default/ {print $3}')
          sleep 6
          curl -sf --noproxy "*" "http://$GW:8095/" | grep -q "<!doctype html" || { docker logs "$CID"; docker rm -f "$CID"; exit 1; }
          curl -sf --noproxy "*" "http://$GW:8095/api/jobs" | grep -q instance
          docker rm -f "$CID" && echo "SMOKE OK (native $NATIVE); cross $CROSS = 编译成功即收货"
      - name: push
        env:
          TOK: ${{ secrets.REGISTRY_PASSWORD }}
          OWNER: ${{ github.repository_owner }}
        run: |
          IMG=${{ steps.vars.outputs.img }}
          if [ -n "$TOK" ]; then
            echo "$TOK" | docker login "${IMG%%/*}" -u "${REGISTRY_USER:-rgan}" --password-stdin
          else
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$OWNER" --password-stdin
          fi
          for TAG in $NATIVE $CROSS; do
            docker push "$IMG:$TAG"
            docker push "$IMG:latest-$TAG"
          done
      - name: record upstream sha (push back)
        env:
          TOK: ${{ secrets.REGISTRY_PASSWORD }}
          SU: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          cd ws
          echo "${{ needs.check-upstream.outputs.sha }}" > .upstream-sha
          git config user.name "ci-bot" && git config user.email "ci@users.noreply.github.com"
          git add .upstream-sha && git commit -qm "ci: upstream -> ${{ needs.check-upstream.outputs.sha }}" || true
          if [ -n "$TOK" ]; then
            git push -q -c http.proxy= "https://oauth2:${TOK}@${SU#https://}/${REPO}.git" HEAD:main
          else
            git push -q HEAD:main
          fi
