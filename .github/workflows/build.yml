name: build

# 双平台兼容 (Forgejo Actions + GitHub Actions), .github/workflows 两边都识别
# 触发: 每日定时检查上游 quer3q/ps5-dump-forge main 是否有新提交; 手动 dispatch 可强制
# mirror 开关 (dispatch 输入, 默认 on):
#   on  = 国内镜像 (Zot 基座 / npmmirror / rsproxy.cn / 南大 apt) — Forgejo 内网 runner
#   off = 官方源 (docker.io / npmjs / crates.io / deb.debian.org) — GitHub 海外 runner

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build.yml', 'Dockerfile', 'docker-compose.yaml']
  schedule:
    - cron: "30 21 * * *"   # 每天 05:30 CST
  workflow_dispatch:
    inputs:
      mirror:
        description: "走国内镜像源 (on/off)"
        required: false
        default: "on"
      force:
        description: "忽略上游 sha 检查, 强制构建 (true/false)"
        required: false
        default: "false"

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
      sha: ${{ steps.cmp.outputs.sha }}
    steps:
      - name: clone (forgejo w/ token; github native)
        env:
          TOK: ${{ secrets.REGISTRY_PASSWORD }}
          SU: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          echo "SU=[$SU] REPO=[$REPO]"
          if [ -n "$TOK" ]; then
            git clone -q "https://oauth2:${TOK}@${SU#https://}/${REPO}.git" ws
          else
            git clone -q "${SU}/${REPO}.git" ws
          fi
          echo CLONE_OK
      - name: compare upstream sha
        id: cmp
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
          UPSTREAM: quer3q/ps5-dump-forge
          HTTPS_PROXY: ${{ secrets.CI_PROXY }}
        run: |
          # api.github.com 通道 (容器内稳定); github.com 主域的 git 协议在 runner 容器内会被掐
          SHA=""
          for i in 1 2 3; do
            SHA=$(curl -s --max-time 30 "https://api.github.com/repos/${UPSTREAM}/commits/main" | grep -m1 '"sha"' | cut -d'"' -f4 || true)
            [ -n "$SHA" ] && break
            echo "sha fetch try$i failed"; sleep 5
          done
          if [ -z "$SHA" ]; then
            echo "::notice:: api.github unreachable from job network — skip (no build this round)"
            echo "changed=false" >> $GITHUB_OUTPUT; echo "sha=" >> $GITHUB_OUTPUT
            exit 0
          fi
          OLD=$(cat ws/.upstream-sha 2>/dev/null || echo none)
          echo "upstream: $SHA (last built: $OLD, force: $FORCE)"
          if [ "$SHA" = "$OLD" ] && [ "$FORCE" != "true" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
          echo "sha=$SHA" >> $GITHUB_OUTPUT

  build:
    needs: check-upstream
    if: needs.check-upstream.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: clone
        env:
          TOK: ${{ secrets.REGISTRY_PASSWORD }}
          SU: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          echo "SU=[$SU] REPO=[$REPO]"
          if [ -n "$TOK" ]; then
            git clone -q "https://oauth2:${TOK}@${SU#https://}/${REPO}.git" ws
          else
            git clone -q "${SU}/${REPO}.git" ws
          fi
          echo CLONE_OK
      - name: resolve vars (registry image / arch tag / mirror)
        id: vars
        env:
          M: ${{ github.event.inputs.mirror }}
          SU: ${{ github.server_url }}
          OWNER: ${{ github.repository_owner }}
        run: |
          ARCH=$(uname -m); [ "$ARCH" = "aarch64" ] && TAG=arm64 || TAG=x86
          case "$SU" in
            *github.com*) IMG="ghcr.io/${OWNER,,}/ps5-dump-forge"; [ -z "$M" ] && M=off ;;
            *) IMG="${{ secrets.INTERNAL_REGISTRY_IMAGE }}"; [ -z "$M" ] && M=on ;;
          esac
          echo "img=$IMG" >> $GITHUB_OUTPUT; echo "tag=$TAG" >> $GITHUB_OUTPUT; echo "mirror=$M" >> $GITHUB_OUTPUT
          echo "image: $IMG:$TAG (mirror=$M)"
      - name: fetch upstream source
        env:
          UPSTREAM: quer3q/ps5-dump-forge
          HTTPS_PROXY: ${{ secrets.CI_PROXY }}
        run: |
          mkdir -p ws/src
          curl -sfL "https://api.github.com/repos/${UPSTREAM}/tarball/${{ needs.check-upstream.outputs.sha }}" -o up.tgz
          tar xzf up.tgz -C ws/src --strip-components=1
          rm up.tgz && ls ws/src | head -5
      - name: docker build (native + cross)
        run: |
          cd ws
          if [ "${{ steps.vars.outputs.mirror }}" = "on" ]; then BP="${{ secrets.BASE_MIRROR_PREFIX }}"; else BP="docker.io/library/"; fi
          # 本机原生 + 交叉另一架构 (--target 剪枝, 每次恰好两轮编译)
          ARCH=$(uname -m); [ "$ARCH" = "aarch64" ] && { NATIVE=arm64; CROSS=x86; } || { NATIVE=x86; CROSS=arm64; }
          echo "native=$NATIVE cross=$CROSS (mirror=${{ steps.vars.outputs.mirror }})"
          docker build --build-arg MIRROR=${{ steps.vars.outputs.mirror }} --build-arg BASE_PREFIX=$BP --target rt-native \
            -t ${{ steps.vars.outputs.img }}:$NATIVE -t ${{ steps.vars.outputs.img }}:latest-$NATIVE .
          docker build --build-arg MIRROR=${{ steps.vars.outputs.mirror }} --build-arg BASE_PREFIX=$BP --target rt-$CROSS \
            -t ${{ steps.vars.outputs.img }}:$CROSS -t ${{ steps.vars.outputs.img }}:latest-$CROSS .
          echo "NATIVE=$NATIVE" >> $GITHUB_ENV; echo "CROSS=$CROSS" >> $GITHUB_ENV
      - name: smoke test (WebUI embedded, native arch only)
        run: |
          docker run -d --name t -p 18095:8095 ${{ steps.vars.outputs.img }}:$NATIVE --root /tmp
          sleep 6
          curl -sf http://127.0.0.1:18095/ | grep -q "<!doctype html" || { docker logs t; docker rm -f t; exit 1; }
          curl -sf http://127.0.0.1:18095/api/jobs | grep -q instance
          docker rm -f t && echo "SMOKE OK (native $NATIVE); cross $CROSS = 编译成功即收货"
      - name: push
        env:
          TOK: ${{ secrets.REGISTRY_PASSWORD }}
          SU: ${{ github.server_url }}
          OWNER: ${{ github.repository_owner }}
        run: |
          case "$SU" in
            *github.com*) echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$OWNER" --password-stdin ;;
            *) echo "$TOK" | docker login "${IMG%%/*}" -u "${{ secrets.INTERNAL_REGISTRY_USER }}" --password-stdin ;;
          esac
          for TAG in $NATIVE $CROSS; do
            docker push ${{ steps.vars.outputs.img }}:$TAG
            docker push ${{ steps.vars.outputs.img }}:latest-$TAG
          done
      - name: record upstream sha (push back)
        env:
          TOK: ${{ secrets.REGISTRY_PASSWORD }}
          SU: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          cd ws
          echo "${{ needs.check-upstream.outputs.sha }}" > .upstream-sha
          git config user.name "ci-bot" && git config user.email "ci@users.noreply.github.com"
          git add .upstream-sha && git commit -qm "ci: upstream -> ${{ needs.check-upstream.outputs.sha }}" || true
          case "$SU" in
            *github.com*) git push -q HEAD:main ;;
            *) git push -q "https://oauth2:${TOK}@${SU#https://}/${REPO}.git" HEAD:main ;;
          esac
